<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal OS</title>
  <script>
    (() => {
      try {
        const t = localStorage.getItem('theme');
        if (t === 'dark' || ((t === 'system' || !t) && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch {}
    })();
  </script>
</head>

<body class="select-none" spellcheck="false">
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
